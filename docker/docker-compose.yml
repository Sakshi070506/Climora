version: "3.9"
services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports: ["8000:8000"]
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports: ["3000:3000"]
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: climora
      POSTGRES_USER: climora
      POSTGRES_PASSWORD: climora
    ports: ["5432:5432"]
